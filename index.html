<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebXR IK</title>

    <!-- A-Frame 공식 importmap 예제와 같은 주소다.
         aframe과 three를 한 곳에서 정해 두면 5주에 불러올 urdf-loader도 같은 three를 쓴다. -->
    <script type="importmap">
      {
        "imports": {
          "aframe": "https://aframe.io/releases/1.8.0/aframe.module.min.js",
          "three": "https://cdn.jsdelivr.net/npm/super-three@0.184.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/super-three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <!-- 바닥 4 m x 4 m. Quest에서는 높이 0이 실제 바닥이고 1은 1 m다.
           실험실 느낌의 밝은 회색이고, 흰 로봇과 구분되도록 책상은 짙은 청회색으로 둔다 -->
      <a-plane rotation="-90 0 0" width="4" height="4" color="#B9BEC4"></a-plane>

      <!-- 책상. 기준점은 책상 아래 바닥 가운데이고 앞 모서리가 시작 위치에서 0.35 m 앞이다.
           치수와 색은 desk 속성에서만 바꾼다. 장착점은 desk가 윗면 위 mountX, mountBack 자리에 놓는다.
           장착점은 왼쪽 뒤라서 로봇이 책상 가운데 쪽으로 팔을 뻗는다 -->
      <a-entity id="desk" desk="width: 1.2; depth: 0.8; height: 0.75; mountX: -0.45; mountBack: 0.30; color: #5F6873; legColor: #33383E" position="0 0 -0.75">
        <!-- 로봇 장착점. 기준점은 윗면 위이고 y가 위쪽, z가 사용자 쪽이다 -->
        <a-entity id="robot-mount" class="mount">
          <a-entity axes-helper="size: 0.2"></a-entity>
          <!-- 심포니급 6축 협동로봇 근사 모델. 모델도 y가 위쪽이다.
               y축으로 70도 돌려 사용자 쪽 오른편을 보게 했다. 사용자가 책상 앞에 서면 팔을 사선 위에서 보게 되어
               어깨, 팔꿈치, 손목이 꺾이는 각도와 공구 끝이 보인다. 정면 배치에서는 관절이 앞뒤로만 움직여 잘 보이지 않았다.
               관절각은 robot-pose에서 정한다. 어깨를 앞으로 기울이고 팔을 뻗어 공구가 책상 위를 내려다보는 자세라서
               공구 끝이 받침에서 약 0.6 m 떨어지고 그 주변에 팔이 없다. 팔을 몸 쪽으로 접으면 공구 끝 주변의 선이 팔과 겹친다.
               robot-mvp는 공구 끝 주황 공을 핀치로 잡아 끌면 관절이 따라오게 하는 AI MVP다.
               joint-axes는 관절마다 좌표축을 띄우고 공구 끝 아래에 장면 좌표를 띄운다 -->
          <a-entity id="robot" gltf-model="./assets/models/symphony-like.glb" rotation="0 70 0" robot-pose="joint2: 30; joint3: 75; joint4: 75"
                    robot-mvp="left: #leftHand; right: #rightHand; desk: #desk" joint-axes="size: 0.08"></a-entity>
        </a-entity>
        <!-- 기록 저장 버튼. 책상 윗면의 오른쪽 앞, 앞 모서리와 오른쪽 모서리에서 18 cm 안쪽이다.
             검지 끝으로 누르면 button-press를 보내고 tool-log가 받아 기록을 내려받는다 -->
        <a-entity id="save-button" press-button="left: #leftHand; right: #rightHand; label: SAVE" position="0.42 0.75 0.22"></a-entity>
      </a-entity>

      <!-- VR에서 나가는 버튼. 책상 오른쪽 앞 모서리 바깥, 서 있는 사람의 오른손 앞 허리 높이에 띄운다.
           공구 끝을 끄는 자리에서 떨어져 있어 끄는 동안 잘못 누르지 않는다. Quest 손바닥 메뉴 동작이 잘 안 먹어서 두었다 -->
      <a-entity id="exit-button" press-button="left: #leftHand; right: #rightHand; label: EXIT VR; color: #C8553D" vr-exit-button position="0.60 1.0 -0.25"></a-entity>
      <!-- 손 확인 판. 책상 오른쪽에서 사용자 쪽을 본다. 환경 확인 판(env-info)은 로봇을 가려서 장면에서 뺐다 -->
      <a-entity hand-info="left: #leftHand; right: #rightHand" position="0.85 1.3 -0.9" rotation="0 -43 0"></a-entity>
      <!-- 로봇 끝 드로잉. 원점에 두어 선의 좌표가 장면 좌표와 같다. 공구 끝 위치는 #robot에서 받고 #save-button을 누르면 선을 모두 지운다 -->
      <a-entity id="drawing" tool-draw="robot: #robot; button: #save-button"></a-entity>
      <!-- 손과 공구 끝 위치 기록. 위치는 #robot에서 받고 #save-button을 누르면 내려받는다 -->
      <a-entity id="log" tool-log="robot: #robot; button: #save-button"></a-entity>
      <!-- 카메라 리그. 카메라와 양손을 함께 담는다.
           start-view는 PC에서 처음 열 때 책상을 30도 내려다보게 한다. VR에서는 머리 방향을 쓰므로 영향이 없다 -->
      <a-entity id="rig">
        <a-entity camera position="0 1.6 0" look-controls wasd-controls start-view="pitch: -30"></a-entity>
        <a-entity id="leftHand" hand-tracking-controls="hand: left"></a-entity>
        <a-entity id="rightHand" hand-tracking-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
