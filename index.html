<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebXR IK</title>

    <!-- A-Frame 공식 importmap 예제와 같은 주소다.
         aframe과 three를 한 곳에서 정해 두면 5주에 불러올 urdf-loader도 같은 three를 쓴다. -->
    <script type="importmap">
      {
        "imports": {
          "aframe": "https://aframe.io/releases/1.8.0/aframe.module.min.js",
          "three": "https://cdn.jsdelivr.net/npm/super-three@0.184.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/super-three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <a-scene background="color: #ECECEC">
      <!-- 바닥 4 m x 4 m. Quest에서는 높이 0이 실제 바닥이고 1은 1 m다 -->
      <a-plane rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>

      <!-- 책상. 기준점은 책상 아래 바닥 가운데이고 앞 모서리가 시작 위치에서 0.35 m 앞이다.
           치수는 desk 속성에서만 바꾼다. 장착점은 desk가 윗면 뒤쪽에 놓는다 -->
      <a-entity id="desk" desk="width: 1.2; depth: 0.8; height: 0.75; mountBack: 0.2" position="0 0 -0.75">
        <!-- 로봇 장착점. 기준점은 윗면 위이고 y가 위쪽, z가 사용자 쪽이다 -->
        <a-entity id="robot-mount" class="mount">
          <!-- 5주 전까지 로봇 자리 표시. 받침 자리 원판(지름 0.2 m)과 좌표축 -->
          <a-cylinder id="robot-placeholder" radius="0.1" height="0.01" position="0 0.005 0" color="#555"></a-cylinder>
          <a-entity axes-helper="size: 0.2"></a-entity>
          <!-- 5주에 여기에 robot-arm 엔티티를 넣는다. URDF는 z가 위쪽이라 x축 -90° 회전이 들어간다 -->
        </a-entity>
      </a-entity>

      <!-- 환경 확인 판. 문제가 생기면 이 판부터 본다. 책상 왼쪽에서 사용자 쪽을 본다 -->
      <a-entity env-info position="-0.85 1.3 -0.9" rotation="0 43 0"></a-entity>

      <!-- 손 확인 판. 책상 오른쪽에서 사용자 쪽을 본다 -->
      <a-entity hand-info="left: #leftHand; right: #rightHand" position="0.85 1.3 -0.9" rotation="0 -43 0"></a-entity>

      <!-- 카메라 리그. 카메라와 양손을 함께 담는다 -->
      <a-entity id="rig">
        <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>
        <a-entity id="leftHand" hand-tracking-controls="hand: left"></a-entity>
        <a-entity id="rightHand" hand-tracking-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
